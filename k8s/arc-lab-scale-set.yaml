# Lab values for gha-runner-scale-set 0.15.1: runners for one repository, scaled 0 to 3.
# Secret arc-github (key github_token) holds a fine-grained token with Administration: read and write on the repo.
githubConfigUrl: https://github.com/Bowsercode-lab/cdlx-lab
githubConfigSecret: arc-github
runnerScaleSetName: arc-lab
minRunners: 0
maxRunners: 3
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
