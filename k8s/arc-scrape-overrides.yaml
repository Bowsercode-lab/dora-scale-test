# Extra values file for the Coralogix otel-integration chart (0.0.379) on the developer-tools cluster.
# Turns on the agent's target allocator so the collector scrapes ServiceMonitor/PodMonitor targets,
# such as the ARC listener and controller metrics. Requires the PodMonitor CRD (monitoring.coreos.com/v1).
opentelemetry-agent:
  targetAllocator:
    enabled: true
    allocationStrategy: "per-node"
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
