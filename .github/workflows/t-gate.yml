name: t-gate
on: workflow_dispatch
jobs:
  deploy:
    permissions: { contents: write, pull-requests: read, actions: read }
    uses: ./.github/workflows/_deploy-t-shipped.yml
    with:
      service: aura-api-gate
      team: dd-advertiser_backend
      project-path: services/aura-api
      environment: gate
    secrets: inherit
