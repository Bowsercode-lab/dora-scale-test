# Reusable deploy workflow. Every service deploy calls this, so every deploy reports exactly once.
name: _deploy-t-shipped
on:
  workflow_call:
    inputs:
      service:      { type: string, required: true }
      team:         { type: string, required: true }
      project-path: { type: string, required: true }
      environment:  { type: string, required: true }
      rollback:     { type: boolean, required: false, default: false }
    secrets:
      CORALOGIX_SEND_YOUR_DATA_KEY: { required: false }
      CORALOGIX_OPS_EVENTS_KEY: { required: false }
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest   # Cardlytics: your ARC scale set label
    environment: ${{ inputs.environment }}   # prod has a required reviewer, which is the approval gate
    # One pending deploy per service and env: a newer merge replaces an older run still waiting at the gate,
    # so the approved deploy carries every merged PR and nothing deploys an older commit afterwards.
    concurrency: { group: "deploy-${{ inputs.environment }}-${{ inputs.service }}", cancel-in-progress: false }
    outputs:
      status: ${{ steps.result.outputs.status }}
      finished-at: ${{ steps.result.outputs.finished-at }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (lab stand-in for helm upgrade / serverless deploy / Onehouse job release)
        run: |
          echo "Deploying ${{ inputs.service }} $(cat ${{ inputs.project-path }}/VERSION)"
          sleep $((RANDOM % 30 + 10))
          if [ -f "${{ inputs.project-path }}/FAIL_DEPLOY" ]; then echo "simulated deploy failure"; exit 1; fi
      # Hand the result to the report job. Not set when the job never ran (approval rejected).
      - name: Record deploy result
        id: result
        if: always()
        run: |
          echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"
          echo "finished-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # Separate job so only this job can write to the repository (it moves the deploy/<env>/<service> tag).
  report:
    needs: deploy
    continue-on-error: true   # a reporting problem never turns the deploy run red
    if: always() && (needs.deploy.outputs.status == 'success' || needs.deploy.outputs.status == 'failure')
    runs-on: ubuntu-latest   # Cardlytics: your ARC scale set label
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/actions/report-deploy }
      - name: Report deployment to Coralogix
        uses: ./.github/actions/report-deploy
        with:
          service: ${{ inputs.service }}
          team: ${{ inputs.team }}
          project-path: ${{ inputs.project-path }}
          environment: ${{ inputs.environment }}
          status: ${{ needs.deploy.outputs.status }}
          finished-at: ${{ needs.deploy.outputs.finished-at }}
          rollback: ${{ inputs.rollback }}
          coralogix-api-key: ${{ secrets.CORALOGIX_SEND_YOUR_DATA_KEY }}
          coralogix-ops-events-key: ${{ secrets.CORALOGIX_OPS_EVENTS_KEY }}
          github-token: ${{ github.token }}
